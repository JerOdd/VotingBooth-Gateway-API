spring.application.name=votingbooth-gateway
server.port=8081

# Routes are bound as one list from a single property source, so keep them here
# and only vary the downstream uris per environment.
# Mobile clients only reach the BFF, which calls vote-service and the other APIs itself.
# /mobile/v1/votes -> BFF /v1/votes: the BFF owns its API versions, the gateway only drops /mobile.
spring.cloud.gateway.routes[0].id=mobile-bff
spring.cloud.gateway.routes[0].uri=${services.mobile-bff.uri}
spring.cloud.gateway.routes[0].predicates[0]=Path=/mobile/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1
